# Tes étiquettes actives. Le script ne suggère QUE ces étiquettes.
#
# - keywords       : motifs cherchés dans la description de la carte, dans la précision
#                    entre parenthèses à la fin du titre (« Couplage (théorie des graphes) »)
#                    et dans les infos Wikidata si --wikidata est activé
# - title_keywords : motifs cherchés dans le titre complet de la carte
# - shiny = true   : étiquette posée sur toutes les cartes shiny (✦), en plus de leur catégorie
#
# Les motifs sont des regex, comparées sans accents ni majuscules,
# et doivent correspondre à des mots entiers. "acteur|actrice" marche,
# "act" ne trouvera pas "acteur" (écrire "act\\w*" pour ça).
#
# Wikidata ne fait que compléter : dès qu'une étiquette trouve un indice dans la carte
# elle-même, celles qui ne viennent que de Wikidata sont écartées. Si la carte a une
# description qui ne matche rien, seule la nature Wikidata (« film », « album »…) compte,
# pas les occupations, trop bruitées.
#
# Pour ajouter une étiquette suggérée par le script, copie le bloc
# proposé dans output/suggestions.md et colle-le à la fin de ce fichier.

[tags."Cinéma/Séries/Acteurs"]
keywords = [
  "acteur", "actrice", "comedien", "comedienne", "cineaste", "realisateur", "realisatrice",
  # pas les scénaristes de bande dessinée ni de jeux
  "scenariste(?! de (bande dessinee|bd|jeux?))",
  "films?", "telefilm", "court[ -]metrage", "long[ -]metrage", "cinema\\w*",
  "serie televisee", "serie de television", "serie d'animation", "mini-?series?",
  "saison de serie", "sitcom", "telenovela", "feuilleton televise", "documentaire",
  "franchise mediatique", "metteur en scene", "metteuse en scene",
  "product(eur|rice) de (cinema|films?)", "societe de production",
  "direct(eur|rice) de la photographie", "doubleur", "doubleuse",
]

[tags."Royauté"]
keywords = [
  "rois?", "reines?", "prince", "princesse", "monarque", "dauphine? de france",
  "empereur", "imperatrice", "dynastie", "souverain", "souveraine",
  "tsar", "tsarine", "sultan", "sultane", "pharaon", "infante?", "emir", "shah", "maharaja\\w*",
  "archiduc", "archiduchesse", "grand-duc", "grande-duchesse",
  "famille (royale|imperiale)", "maison (royale|imperiale)", "(reine|roi|prince) consort",
]
title_keywords = [
  "^liste des (rois|reines|souverains|monarques|empereurs|imperatrices|pharaons|sultans|tsars|princes|emirs)\\b",
]

