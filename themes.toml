# Thématiques candidates. Elles ne sont PAS suggérées sur les cartes :
# elles servent à détecter les thèmes qui reviennent souvent dans tes
# cartes non étiquetées. Quand un thème dépasse le seuil (--min-count),
# il apparaît dans output/suggestions.md avec un bloc prêt à coller
# dans rules.toml.
#
# Même format que rules.toml. Tu peux en ajouter librement.

[tags."Sport"]
keywords = [
  "footballeur", "footballeuse", "cycliste", "perchiste", "grimpeur", "grimpeuse",
  "athlete", "joueur de \\w+", "joueuse de \\w+", "tennisman", "tenniswoman",
  "boxeur", "boxeuse", "nageur", "nageuse", "rugbyman", "basketteur", "basketteuse",
  "handballeur", "handballeuse", "pilote (automobile|de course|de moto)",
  "skieur", "skieuse", "judoka", "entraineur", "entraineuse", "sportif", "sportive",
  "club de \\w+", "equipe de \\w+", "championnat", "coupe du monde",
  "jeux olympiques", "stade",
]
title_keywords = ["^equipe de", "championnat", "coupe du monde", "jeux olympiques"]

[tags."Politique"]
keywords = [
  "homme politique", "femme politique", "personnalite politique", "parti politique",
  "depute", "deputee", "senateur", "senatrice", "ministre", "president", "presidente",
  "premier ministre", "maire", "diplomate", "politico\\w*", "election", "syndicat\\w*",
]

